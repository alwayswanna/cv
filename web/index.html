<script>
  // Prints resume by injecting HTML into a hidden iframe,
  // completely bypassing Flutter's canvas so the full page is captured.
  window.printResumeHtml = function(htmlContent) {
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(iframe);

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(htmlContent);
    doc.close();

    // Double rAF ensures the iframe content is fully rendered before printing.
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        document.body.removeChild(iframe);
      });
    });
  };
</script>
